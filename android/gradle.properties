# Keep the build light on Bacca's PC: few workers, bounded heaps, no separate Kotlin daemon.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# JavaScript engine of the Bare worklet: quickjs or v8 (see app/build.gradle.kts).
mpfy.jsEngine=quickjs
